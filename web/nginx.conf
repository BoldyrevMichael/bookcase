# Фронтенд — статические файлы, и ничего больше. Сборки нет: пять страниц, один файл стилей,
# один общий скрипт. Всё, что связано с входом и токенами, остаётся на шлюзе, поэтому
# здесь не нужны ни прокси к API, ни настройки cookie.
server {
    # 8080, а не 80: процесс работает не от root, а порты ниже 1024 такому процессу
    # занимать нельзя. Это же значение слушает образ nginx-unprivileged.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Разметка и скрипты правятся часто, а имена файлов не меняются: кэшировать их
    # у клиента — значит показывать вчерашнюю страницу после сегодняшней правки.
    add_header Cache-Control "no-cache" always;
    # Заголовки объявлены на уровне сервера, и внутри location своих быть не должно:
    # в nginx add_header не наследуется, если во вложенном блоке появился хоть один
    # собственный — политика содержимого просто перестала бы отдаваться.
    location / {
        try_files $uri $uri/ =404;
    }

    # Обычные меры для страницы, которая показывает пользовательские данные.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Политика содержимого: браузер сам следит, чтобы страница не выполнила ничего,
    # кроме наших файлов, и не отправила данные на чужой адрес.
    #
    # Это второй рубеж против чужого кода. Первый — экранирование: названия и авторы
    # приходят из чужих файлов и ответов справочников, и разметка в них должна
    # отображаться текстом. Политика страхует на случай, если где-то забыли.
    #
    # Ради неё код страниц вынесен из разметки в отдельные файлы, а встроенные стили
    # заменены классами: разрешение 'unsafe-inline' свело бы всю защиту на нет.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    gzip on;
    gzip_types text/css application/javascript text/html;
}
