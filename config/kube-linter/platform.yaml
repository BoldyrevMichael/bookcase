# Проверка манифестов платформы — того, что разворачивают чужие чарты
# (Grafana, Prometheus, Keycloak, SeaweedFS, Tempo, Valkey, шлюз входа).
#
# Набор тот же, что у собственных сервисов, за вычетом двух проверок. Обе
# относятся к тому, как чужие образы запускаются внутри, и через значения
# чартов не задаются: пришлось бы править их шаблоны и заново проверять каждый
# компонент. Всё, что настраивается значениями, здесь исправлено — пределы
# ресурсов у всех частей, права Grafana в пределах пространства имён, описание
# realm в секрете вместо карты настроек, отсутствие повторов переменных.
#
# Свои рабочие нагрузки обе проверки проходят: смотри config/kube-linter/services.yaml.
checks:
  addAllBuiltIn: false
  exclude:
    - no-read-only-root-fs
    - run-as-non-root
