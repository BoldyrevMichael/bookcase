# Хранилище трасс. Одним процессом: у Tempo есть и режим из отдельных служб, но он
# рассчитан на поток, которого здесь нет, и стоил бы вчетверо больше памяти.

server:
  http_listen_port: 3200

# Принимаем только по OTLP — это то, на чём говорят сервисы. Приёмники Jaeger и Zipkin
# Tempo тоже умеет, но включать их незачем: лишние открытые порты без единого отправителя.
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Насколько долго трасса лежит в памяти, прежде чем попасть на диск. Значение по умолчанию —
  # полчаса, и всё это время свежую трассу не найти поиском. На стенде смотрят как раз то,
  # что только что произошло, поэтому минута.
  max_block_duration: 1m

compactor:
  compaction:
    # Сколько хранить. Без предела трассы копятся, пока есть диск.
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Предел на саму программу, а не только на контейнер: одна трасса не должна съесть память
# целиком. Книга проходит четыре сервиса, отрезков в ней десятки — 5 МБ хватает с запасом.
overrides:
  defaults:
    global:
      max_bytes_per_trace: 5000000
