apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      # Точка на графике, за которой стоит конкретный запрос: по идентификатору трассы
      # из неё открывается сам путь запроса в Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
