apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Идентификатор трассы в журнале и есть идентификатор в Tempo, поэтому из записи
      # журнала можно перейти к трассе и обратно. Настройка связи с хранилищем журналов
      # здесь не задана: журналы пишутся в поток вывода, отдельного хранилища для них нет.
      nodeGraph:
        enabled: false
