# oauth2-proxy в роли BFF.
#
# Идентификатор клиента, его секрет, секрет cookie и адрес Valkey приходят
# переменными окружения (см. compose.yaml) — в файле их нет.

http_address = "0.0.0.0:4180"

# На стенде перед прокси никого нет, поэтому заголовкам X-Forwarded-* верить
# не с чего. В кластере, где спереди стоит Envoy, здесь будет true вместе
# с trusted_proxy_ip на его подсеть.
reverse_proxy = false

provider = "keycloak-oidc"
provider_display_name = "bookcase"

# Издатель — тот адрес, который видит браузер и который стоит в claim iss
# выданного токена. Внутри сети контейнеров такого имени нет, поэтому
# автообнаружение выключено, а служебные адреса заданы вручную: за токеном,
# ключами и профилем oauth2-proxy ходит напрямую к контейнеру Keycloak.
oidc_issuer_url = "http://localhost:8180/realms/bookcase"
skip_oidc_discovery = true
login_url = "http://localhost:8180/realms/bookcase/protocol/openid-connect/auth"
redeem_url = "http://keycloak:8080/realms/bookcase/protocol/openid-connect/token"
oidc_jwks_url = "http://keycloak:8080/realms/bookcase/protocol/openid-connect/certs"
profile_url = "http://keycloak:8080/realms/bookcase/protocol/openid-connect/userinfo"

scope = "openid profile email"

# Адрес возврата задаётся явно, а не выводится из заголовка Host: иначе вход
# через 127.0.0.1 отправит Keycloak на адрес, которого нет в списке
# разрешённых, а сессия окажется привязана к другому имени узла.
# Стенд открывается по http://localhost:4180.
redirect_url = "http://localhost:4180/oauth2/callback"

# Своя страница со ссылкой «войти» тут лишняя: неавторизованный запрос сразу
# уходит на страницу входа Keycloak.
skip_provider_button = true

# Сессии в Valkey: токены Keycloak в четыре килобайта cookie не помещаются.
session_store_type = "redis"
cookie_name = "bookcase_session"
cookie_expire = "8h"
cookie_refresh = "5m"
cookie_httponly = true
cookie_samesite = "lax"
# Стенд работает по http; в кластере это значение обязано стать true.
cookie_secure = false

# Личная библиотека: годится любой, кто завёл учётную запись в realm.
email_domains = ["*"]

# Почта у нас ничего не решает: владелец книг определяется по sub из токена, а домен
# почты не ограничен (см. строку выше). Между тем шлюз по умолчанию отказывает входу,
# если Keycloak не пометил почту подтверждённой, — и самостоятельно зарегистрировавшийся
# читатель не мог войти вовсе. Подтверждение почты требует почтового сервера, которого
# на стенде нет; когда он появится, достаточно включить проверку в самом Keycloak.
insecure_oidc_allow_unverified_email = true

# Для обращений к API шлюз отвечает отказом, а не переводом на страницу входа.
# Разница существенная: страницу открывает человек, и его нужно вести на вход, а запрос
# из скрипта ждёт данных, и страница входа приезжает к нему как «успешный» ответ с чужим
# содержимым — разбор JSON падает на первом же символе разметки.
api_routes = ["^/api/"]

# Запрос с уже готовым Bearer проходит мимо сессии — это путь программных
# клиентов. Подпись, издателя и получателя всё равно проверяет сам сервис.
skip_jwt_bearer_tokens = true

# Получателя прокси сверяет со своим идентификатором клиента, а токены API
# выписаны на bookcase-api — без этой строки программный клиент отправлялся бы
# на страницу входа вместо сервиса.
oidc_extra_audiences = ["bookcase-api"]

# Негодный токен — это отказ, а не приглашение войти: программному клиенту
# перенаправление на страницу входа сообщает не то, что произошло.
bearer_token_login_fallback = false

# В заголовок Authorization oauth2-proxy кладёт ID-токен — тот, что выписан
# самому шлюзу и описывает вход пользователя. Для обращения к API он не годится:
# получатель у него другой, да и предназначен он клиенту, а не сервису. Поэтому
# наверх идёт токен доступа, отдельным заголовком X-Forwarded-Access-Token.
#
# Доверия к этому заголовку у сервиса нет: он говорит лишь, где искать токен,
# а подпись, издателя, получателя и срок сервис проверяет сам.
pass_authorization_header = false
set_authorization_header = false
pass_access_token = true
pass_basic_auth = false
pass_user_headers = false

# Маршруты по путям заданы переменной OAUTH2_PROXY_UPSTREAMS в compose.yaml:
# адрес сервиса зависит от того, где он запущен, и в файле правил ему не место.
# Совпадение идёт по началу пути, частные адреса стоят раньше общего; всё,
# что не подошло, отвечает пустым 200 — это место будущего фронтенда.

# Публичное: ссылки со встроенным пропуском. Пропуск проверяет сам сервис — подпись,
# срок и то, на что он выписан, — поэтому вход здесь не нужен и только мешал бы:
# по такой ссылке переходят из письма или из соседней вкладки.
skip_auth_routes = [
    "GET=^/healthz$",
    "GET=^/api/v1/files/[^/]+/download/[^/]+$",
    "GET=^/api/v1/archives/[^/]+/download/[^/]+$"
]
ping_path = "/ping"
