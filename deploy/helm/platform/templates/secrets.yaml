{{- if .Values.secrets.create }}
# Секреты стенда. В настоящем окружении этого файла нет вовсе: значения приезжают
# из хранилища секретов, а сервисы ссылаются на них по именам — те же, что здесь.
apiVersion: v1
kind: Secret
metadata:
  name: bookcase-db
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  service-password: {{ .Values.secrets.servicePassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bookcase-storage
type: Opaque
stringData:
  s3-access-key: {{ .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | quote }}
  download-token-secret: {{ .Values.secrets.downloadTokenSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bookcase-enricher
type: Opaque
stringData:
  client-secret: {{ .Values.secrets.enricherClientSecret | quote }}
  # Пусто — значит справочник Google Books выключен, и уточнение работает
  # на одной Open Library. Ключ подставляется при установке: --set.
  google-books-api-key: {{ .Values.secrets.googleBooksApiKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bookcase-valkey
type: Opaque
stringData:
  password: {{ .Values.secrets.valkeyPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bookcase-keycloak
type: Opaque
stringData:
  admin-password: {{ .Values.secrets.keycloakAdminPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: bookcase-bff
type: Opaque
stringData:
  # Имена ключей заданы чартом шлюза: он ищет именно их.
  client-id: bookcase-bff
  client-secret: {{ .Values.secrets.bffClientSecret | quote }}
  cookie-secret: {{ .Values.secrets.bffCookieSecret | quote }}
---
# Учётные записи объектного хранилища в том виде, в каком их ждёт SeaweedFS.
apiVersion: v1
kind: Secret
metadata:
  name: bookcase-seaweedfs-s3
type: Opaque
stringData:
  seaweedfs_s3_config: |
    {
      "identities": [
        {
          "name": "storage",
          "credentials": [
            {
              "accessKey": "{{ .Values.secrets.s3AccessKey }}",
              "secretKey": "{{ .Values.secrets.s3SecretKey }}"
            }
          ],
          "actions": ["Read", "Write", "List", "Tagging", "Admin"]
        }
      ]
    }
{{- end }}
