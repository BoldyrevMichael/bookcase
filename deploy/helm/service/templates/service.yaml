apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.api }}
      targetPort: http
    {{- if .Values.ports.management }}
    # Служебный порт объявлен, но наружу не выставлен: по нему ходят пробы и сбор метрик.
    - name: management
      port: {{ .Values.ports.management }}
      targetPort: management
    {{- end }}
