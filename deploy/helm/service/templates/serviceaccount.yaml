{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
# Учётная запись нужна не ради обращений к самому Kubernetes — их сервис не делает, —
# а чтобы не пользоваться общей учётной записью пространства имён: её токен по умолчанию
# монтируется во все поды подряд.
automountServiceAccountToken: false
{{- end }}
