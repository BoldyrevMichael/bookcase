apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "service.labels" . | nindent 8 }}
      annotations:
        # Пересоздание пода при изменении настроек: без этого правка переменных
        # не доедет до работающего сервиса, и он будет жить со старыми значениями.
        checksum/config: {{ toYaml .Values.env | sha256sum }}
        {{- if .Values.ports.management }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.ports.management | quote }}
        prometheus.io/path: /actuator/prometheus
        {{- end }}
    spec:
      serviceAccountName: {{ if .Values.serviceAccount.create }}{{ include "service.name" . }}{{ else }}default{{ end }}
      automountServiceAccountToken: false
      securityContext:
        # Те же права, что и в образе, но заданные и здесь: образ можно подменить,
        # а манифест — это то, что кластер проверяет сам.
        runAsNonRoot: true
        runAsUser: {{ .Values.security.runAsUser }}
        runAsGroup: {{ .Values.security.runAsUser }}
        fsGroup: {{ .Values.security.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.ports.api }}
            {{- if .Values.ports.management }}
            - name: management
              containerPort: {{ .Values.ports.management }}
            {{- end }}
          {{- if or .Values.env .Values.envFromSecret }}
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $name, $ref := .Values.envFromSecret }}
            # Пароли и ключи приезжают из секретов, а не из значений чарта: values
            # лежат в репозитории, и место секрета не там.
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $ref.secret }}
                  key: {{ $ref.key }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.probes.path.readiness }}
              port: {{ if .Values.ports.management }}management{{ else }}http{{ end }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path.readiness }}
              port: {{ if .Values.ports.management }}management{{ else }}http{{ end }}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path.liveness }}
              port: {{ if .Values.ports.management }}management{{ else }}http{{ end }}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Корневая файловая система только для чтения, поэтому всё, куда пишут,
            # объявлено явно: временные файлы Java и загружаемые книги, которые
            # приёмник запроса складывает на диск, прежде чем отдать сервису.
            - name: tmp
              mountPath: /tmp
            {{- range .Values.extraWritablePaths }}
            - name: {{ .name }}
              mountPath: {{ .path }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
        {{- range .Values.extraWritablePaths }}
        - name: {{ .name }}
          emptyDir:
            sizeLimit: {{ .sizeLimit }}
        {{- end }}
      # Время на завершение: сервис должен успеть дочитать текущий запрос и закрыть
      # соединения с базой, а не быть убитым посреди записи.
      terminationGracePeriodSeconds: 30
