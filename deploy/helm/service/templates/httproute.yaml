{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway }}
      {{- if .Values.route.gatewayNamespace }}
      namespace: {{ .Values.route.gatewayNamespace }}
      {{- end }}
  rules:
    # Пути перечислены поимённо, без «всё остальное сюда». Это не формальность:
    # именно так обложки остаются недоступными снаружи, хотя сервис их отдаёт.
    - matches:
        {{- range .Values.route.paths }}
        - path:
            type: {{ .type | default "PathPrefix" }}
            value: {{ .value }}
        {{- end }}
      backendRefs:
        - name: {{ include "service.name" . }}
          port: {{ .Values.ports.api }}
{{- end }}
