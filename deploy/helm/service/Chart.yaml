apiVersion: v2
name: service
description: |
  Общий чарт для сервисов bookcase. Один чарт на все пять релизов: устроены они
  одинаково — образ, порт API, служебный порт с пробами, набор переменных, — а различия
  сведены к значениям. Расклеивать его на пять копий имеет смысл, только если сервисы
  разойдутся по форме: например, у разбора появится отдельный набор фоновых рабочих,
  а у хранилища — постоянный том.
type: application
version: 0.1.0
appVersion: "0.1.0"
