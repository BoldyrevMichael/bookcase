# Значения по умолчанию. Всё, что различается между сервисами, задаётся в
# deploy/helm/values/<сервис>.yaml — Helm сливает файлы слева направо, поэтому
# общее не приходится повторять пять раз.

# Имя релиза используется как имя сервиса; переопределяется только при надобности.
nameOverride: ""

image:
  repository: bookcase/catalog
  tag: "0.1.0"
  # Образы кладутся в кластер напрямую (kind load), а не тянутся из хранилища образов:
  # своего хранилища у стенда нет, а попытка сходить наружу закончилась бы ErrImagePull.
  pullPolicy: IfNotPresent

replicas: 1

# Порт, на котором сервис отвечает на запросы, и порт со служебными точками.
# У страниц служебного порта нет — там пробы смотрят на сам сайт.
ports:
  api: 8080
  management: 8081

# Пробы. Готовность и живость разведены намеренно: живость перезапускает под,
# готовность лишь убирает его из балансировки, и путать их — значит перезапускать
# сервис за то, что он ждёт недоступную базу.
probes:
  path:
    liveness: /actuator/health/liveness
    readiness: /actuator/health/readiness
  # Долгий запуск — это не поломка: Spring поднимается секунды, а миграции базы
  # добавляют ещё. Проба запуска даёт на это время, не удлиняя проверку живости.
  startup:
    failureThreshold: 30
    periodSeconds: 5

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Переменные окружения сервиса: простые значения и ссылки на секреты.
env: {}
envFromSecret: {}

# Маршрут снаружи. Пути перечисляются явно: то, чего здесь нет, снаружи недоступно —
# так, например, обложки видны только каталогу внутри кластера.
route:
  enabled: false
  gateway: bookcase
  gatewayNamespace: ""
  paths: []

# Кому позволено обращаться к сервису и куда позволено ему. По умолчанию наружу нельзя:
# в интернет ходит только уточнитель, и это ограничение должно быть видно в манифесте,
# а не держаться на договорённости.
network:
  enabled: true
  # Кто может обращаться сюда: имена сервисов либо слово gateway — для шлюза,
  # который живёт в отдельном пространстве имён.
  allowFrom: []
  # Куда может обращаться этот сервис помимо базы и очереди.
  allowTo: []
  # Выход в интернет. Разрешён ровно одному сервису — уточнителю.
  allowExternal: false
  toDatabase: true
  toKafka: true
  # За ключами подписи токенов ходят все сервисы: подпись каждый проверяет сам.
  toKeycloak: true
  # Трассы отправляют тоже все, кроме страниц: они статические и своего кода не имеют.
  toTempo: true
  gatewayNamespace: envoy-gateway-system
  monitoringNamespace: bookcase
  # Подсети кластера: их исключают из «выхода наружу», чтобы разрешение ходить
  # в интернет не превращалось в разрешение ходить к соседям.
  clusterCidrs:
    - 10.244.0.0/16
    - 10.96.0.0/12

serviceAccount:
  create: true

security:
  # Тот же пользователь, что и в образе. Значение продублировано намеренно:
  # кластер проверяет манифест, а не то, что написано в образе.
  runAsUser: 10001

# Корневая система только для чтения, поэтому места для записи объявляются явно.
tmpSizeLimit: 512Mi
extraWritablePaths: []
