# Кластер для проверки выката. Один узел: проверяется раскладка и связность,
# а не устойчивость к отказу узла — для этого нужен настоящий кластер.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: bookcase
nodes:
  - role: control-plane
    # Порт наружу пробрасывается напрямую: адрес, выданный балансировщиком,
    # виден только внутри машины с kind, а браузер живёт снаружи.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
