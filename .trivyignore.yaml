## Принятые риски. Каждая запись отвечает на три вопроса: что подавлено, почему это
## не опасно здесь и до какого числа решение действует. По истечении срока находка
## снова роняет проверку — забыть про неё нельзя.
##
## Файл нужно передавать явно: `--ignorefile .trivyignore.yaml`. Сам Trivy находит
## только старый построчный `.trivyignore`, в котором нет места обоснованию.

# ── Уязвимости в зависимостях ────────────────────────────────────────────────
# Общее правило: версии, которыми управляют спецификации зависимостей (Spring Boot
# и AWS SDK), здесь не переопределяются. Переопределение вынимает одну библиотеку
# из проверенного набора и делает сборку не тем, что выпускали и проверяли авторы
# спецификации. Ждём выпуск, где версия поднята, — а до него держим находку
# подавленной с разбором, достижим ли уязвимый путь в этой системе.
#
# Версия в purl указана намеренно: как только спецификация принесёт другую,
# подавление перестанет действовать и находку придётся разобрать заново.
vulnerabilities:
  - id: CVE-2026-54291
    purls: ["pkg:maven/org.postgresql/postgresql@42.7.11"]
    statement: >-
      Понижение SCRAM-SHA-256-PLUS: посредник может убедить драйвер отказаться
      от привязки к каналу. Привязка к каналу здесь не используется вовсе —
      соединение с базой идёт внутри кластера без TLS, а само её наличие ничего
      не подтверждало бы. Исправление приедет с драйвером 42.7.12 в очередном
      выпуске спецификации Spring Boot.
    expired_at: 2026-11-01

  - id: CVE-2026-59889
    purls: ["pkg:maven/tools.jackson.core/jackson-databind@3.1.4"]
    statement: >-
      Обход @JsonView для свойств, помеченных @JsonUnwrapped. В коде нет ни одного
      @JsonView (проверено поиском по всем модулям), то есть уязвимый путь
      недостижим. Ждём jackson 3.1.5 в спецификации Spring Boot.
    expired_at: 2026-11-01

  - id: CVE-2026-49844
    purls: ["pkg:maven/org.apache.logging.log4j/log4j-api@2.25.4"]
    statement: >-
      Неверное кодирование при выводе журнала в JSON. Журналом занимается Logback:
      из log4j на пути только api и мост log4j-to-slf4j, log4j-core со своими
      разметками вывода отсутствует. Ждём 2.25.5 в спецификации Spring Boot.
    expired_at: 2026-11-01

  - id: CVE-2026-59949
    purls: ["pkg:maven/at.yawk.lz4/lz4-java@1.10.1"]
    statement: >-
      Падение JVM в собственном коде XXHash при неверных входных данных. Библиотека
      приезжает с клиентом Kafka и работает только при сжатии lz4; сжатие
      у отправителей не включено (значение по умолчанию — без сжатия), и ни один
      топик его не требует. Ждём 1.11.1 в составе клиента Kafka.
    expired_at: 2026-11-01

  # Netty приезжает в storage вместе с AWS SDK — как транспорт асинхронного клиента S3.
  # Один и тот же разбор на все находки: клиент S3 здесь синхронный (S3Client,
  # см. storage/config/S3Config.java), асинхронный не создаётся, сервером Netty
  # не работает. Ждём 4.2.16.Final в спецификации AWS SDK.
  - { id: CVE-2026-55831, purls: ["pkg:maven/io.netty/netty-codec-http@4.2.15.Final"],        statement: "Netty из AWS SDK: асинхронный клиент S3 не создаётся, сервером Netty не работает.", expired_at: 2026-11-01 }
  - { id: CVE-2026-55833, purls: ["pkg:maven/io.netty/netty-codec-http@4.2.15.Final"],        statement: "Netty из AWS SDK: асинхронный клиент S3 не создаётся, сервером Netty не работает.", expired_at: 2026-11-01 }
  - { id: CVE-2026-56745, purls: ["pkg:maven/io.netty/netty-codec-http@4.2.15.Final"],        statement: "Netty из AWS SDK: асинхронный клиент S3 не создаётся, сервером Netty не работает.", expired_at: 2026-11-01 }
  - { id: CVE-2026-56746, purls: ["pkg:maven/io.netty/netty-codec-http@4.2.15.Final"],        statement: "Netty из AWS SDK: асинхронный клиент S3 не создаётся, сервером Netty не работает.", expired_at: 2026-11-01 }
  - { id: CVE-2026-59898, purls: ["pkg:maven/io.netty/netty-codec-http@4.2.15.Final"],        statement: "Netty из AWS SDK: асинхронный клиент S3 не создаётся, сервером Netty не работает.", expired_at: 2026-11-01 }
  - { id: CVE-2026-59899, purls: ["pkg:maven/io.netty/netty-codec-http@4.2.15.Final"],        statement: "Netty из AWS SDK: асинхронный клиент S3 не создаётся, сервером Netty не работает.", expired_at: 2026-11-01 }
  - { id: CVE-2026-59921, purls: ["pkg:maven/io.netty/netty-codec-http@4.2.15.Final"],        statement: "Netty из AWS SDK: асинхронный клиент S3 не создаётся, сервером Netty не работает.", expired_at: 2026-11-01 }
  - { id: CVE-2026-56819, purls: ["pkg:maven/io.netty/netty-codec-http2@4.2.15.Final"],       statement: "Netty из AWS SDK: асинхронный клиент S3 не создаётся, сервером Netty не работает.", expired_at: 2026-11-01 }
  - { id: CVE-2026-59900, purls: ["pkg:maven/io.netty/netty-codec-http2@4.2.15.Final"],       statement: "Netty из AWS SDK: асинхронный клиент S3 не создаётся, сервером Netty не работает.", expired_at: 2026-11-01 }
  - { id: CVE-2026-59901, purls: ["pkg:maven/io.netty/netty-codec-compression@4.2.15.Final"], statement: "Netty из AWS SDK: асинхронный клиент S3 не создаётся, сервером Netty не работает.", expired_at: 2026-11-01 }

# ── Несоответствия настроек ──────────────────────────────────────────────────
# Здесь срок не ставится: это не ожидание чужого выпуска, а принятые решения.
# Пересматриваются они не по календарю, а когда меняется то, из чего исходили.
misconfigurations:
  - id: DS-0026
    paths: ["deploy/docker/*.Dockerfile"]
    statement: >-
      HEALTHCHECK в образе не задан намеренно: состояние контейнера определяют
      пробы Kubernetes по /actuator/health, а HEALTHCHECK из образа Kubernetes
      не смотрит вовсе. В стенде на compose пробы заданы в самом compose.yaml.

  - id: KSV-0110
    paths: ["deploy/helm/**", "*.yaml"]
    statement: >-
      «Объект в пространстве имён default» — след того, как проверяются шаблоны:
      в них пространство имён не записано и подставляется при установке
      (`helm install -n bookcase`, см. deploy/helm/install.sh). Записать его
      в шаблон означало бы запретить ставить приложение куда-то ещё.

  # ── Чужие чарты ────────────────────────────────────────────────────────────
  # Ниже — находки в собранных манифестах платформы (Grafana, Prometheus,
  # Keycloak, SeaweedFS, Tempo). Свои рабочие нагрузки эти правила выполняют:
  # у сервисов и у разовой задачи заведения корзин задан и непривилегированный
  # пользователь, и файловая система только для чтения. Чужие чарты приведены
  # к тому же виду настолько, насколько это позволяют их значения (пределы
  # ресурсов, права в пределах пространства имён, секрет вместо карты настроек);
  # остальное потребовало бы править чужие шаблоны и заново проверять каждый
  # компонент. Путь `platform.yaml` — имя файла с собранными манифестами
  # платформы, который проверяет `tools/scan.sh charts`.
  - id: KSV-0014
    paths: ["platform.yaml"]
    statement: >-
      Файловая система только для чтения у чужих компонентов. Каждый из них
      пишет в своё рабочее место (Grafana — в /var/lib/grafana, Prometheus —
      в базу, Keycloak — в /opt/keycloak/data), и запрет записи потребовал бы
      разбираться с каждым отдельно. Данные всё равно лежат в emptyDir и
      переустановку не переживают.

  - id: KSV-0118
    paths: ["platform.yaml"]
    statement: >-
      Контекст безопасности по умолчанию у чужих компонентов: чарты не дают
      задать его целиком, а частичная замена оставляет тот же результат.

  - id: KSV-0109
    paths: ["platform.yaml"]
    statement: >-
      Правило срабатывает на слово «secret» в настройках шлюза входа
      (deploy/helm/platform/files/oauth2-proxy.cfg) и в подготовительном
      сценарии чарта Valkey. Значений там нет: и тот и другой лишь называют
      секреты, из которых значение приезжает переменной окружения. Описание
      realm, где секреты клиентов действительно есть, вынесено из карты
      настроек в Secret.

  - id: KSV-0125
    paths: ["deploy/helm/**", "*.yaml"]
    statement: >-
      «Образ не из доверенного хранилища»: образы сервисов называются
      bookcase/<сервис> и в стенде живут только в кластере (kind load). Правило
      сверяется со списком известных публичных хранилищ, а собственное
      в этот список не входит.
